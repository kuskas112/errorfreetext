services:
  app:
    build: .
    container_name: errorfreetext-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/errorfreetext
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

  db:
    image: postgres:16-alpine
    container_name: errorfreetext-db
    environment:
      POSTGRES_DB: errorfreetext
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d errorfreetext"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: